
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Sentinel | Security Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>
    <header>
        <h1>API Sentinel</h1>
        <p>Authentication Security Monitoring Dashboard</p>
    </header>

    <main>
        <section id="overview">
            <h2>Security Overview</h2>

            <div class="stats">
                <article>
                    <h3>Total Login Events</h3>
                    <p id="total-events">--</p>
                </article>

                <article>
                    <h3>Failed Logins</h3>
                    <p id="failed-logins">--</p>
                </article>

                <article>
                    <h3>Security Alerts</h3>
                    <p id="total-alerts">--</p>
                </article>
            </div>
        </section>

        <section id="alerts">
            <h2>Recent Security Alerts</h2>
            <div id="alerts-container">
                <p>Dashboard data is not connected yet.</p>
            </div>
        </section>
    </main>
</body>
</html>
